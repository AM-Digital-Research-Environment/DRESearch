# Lighthouse budgets for the search pages, on every PR + push to main.
#
# The two fixtures under tests/lighthouse/fixtures/ are live AMIRA pages'
# own rendered markup — a Research items search block with its server-rendered
# first page, and the federated results page for a query — with the API
# responses those pages made on load, captured by scripts/lighthouse/capture.mjs.
# scripts/lighthouse/server.mjs serves them gzipped, as the live site serves the
# module, writes the module's <head> from this checkout's build manifest (as
# src/View/BundleAssets.php does), and stands in for the thumbnails and the
# /dre-search/api/* endpoints. scripts/check-lighthouse.mjs loads each page three
# times in Lighthouse (mobile, simulated slow 4G) and holds the median run
# against tests/lighthouse/baseline.json:
#
#   - script / stylesheet / image / font transfer bytes and the request count
#     may grow by at most 10% (deterministic: every run must load the same
#     bytes, or the page is reported as unstable);
#   - the /dre-search/api/* round trips made on load may not grow at all;
#   - the accessibility and best-practices scores may not fall (they repeat
#     run to run on one host);
#   - the performance score may fall by at most the margin the script states.
#
# The baseline must come from THIS runner, never a laptop, whose CPU and fonts
# are not the runner's. While tests/lighthouse/baseline.json does not exist the
# job runs in bootstrap mode: it measures, uploads the measured baseline.json in
# the `lighthouse` artifact, and passes. Commit that file as
# tests/lighthouse/baseline.json to turn the gate on, and re-baseline the same
# way after a deliberate change (the procedure is in the script's docblock and
# in CONTRIBUTING.md). A page that got 20% lighter, or whose accessibility or
# best-practices score rose, fails too until the baseline is rewritten, so an
# improvement is locked in rather than left as headroom.
#
# asset/dist is not tracked, so the job builds it, as the release does.

name: Lighthouse budgets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse budgets (search pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # The build ends with the gzip bundle budget (npm run check:size).
      - name: Build the client
        run: npm run build

      # An exact Chrome for Testing build, not the runner image's Chrome, so an
      # image update cannot move the scores under an unchanged tree. Keep it on
      # the major @playwright/test's Chromium is (156 for Playwright 1.64).
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 156.0.8078.73
          install-dependencies: true

      - name: Lighthouse budgets, median of three runs per page
        run: npm run check:lighthouse
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Keep the reports and the measured baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: test-results/lighthouse/
          retention-days: 14
          if-no-files-found: ignore
