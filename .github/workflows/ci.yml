name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify committed production bundle
        run: git diff --exit-code -- asset/dist

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      typesense:
        image: typesense/typesense:30.1
        ports:
          - 8108:8108
        env:
          TYPESENSE_API_KEY: dre-search-ci-key
          TYPESENSE_DATA_DIR: /data
    env:
      TYPESENSE_HOST: 127.0.0.1
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: dre-search-ci-key
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find Module.php config src tests/phpunit -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - run: composer analyse

  release-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: test -f LICENSE && test -f SECURITY.md && test -f CHANGELOG.md && test -f CONTRIBUTING.md
      - run: grep -q '^version[[:space:]]*=[[:space:]]*"1.17.0"' config/module.ini
