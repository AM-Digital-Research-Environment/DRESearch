name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole suite before it packages anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # lint:schema and lint:i18n are PHP scripts.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run check
      # asset/dist is a build product, not tracked; build it like the release.
      - run: npm run build
      - run: npm test

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dre-search-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdre-search-ci-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
      typesense:
        # Keep this on the version the DRE stack actually runs (currently the
        # latest stable, 30.2). The schema test asserts what the *server*
        # accepts, so a drifting pin would validate against rules no deployment
        # is using.
        image: typesense/typesense:30.2
        ports:
          - 8108:8108
        # The Typesense image does not create the data dir itself; without a
        # mounted volume the server exits at boot ("Data directory /data does
        # not exist").
        volumes:
          - typesense-data:/data
        env:
          TYPESENSE_API_KEY: dre-search-ci-key
          TYPESENSE_DATA_DIR: /data
    env:
      OMEKA_VENDOR: /tmp/omeka-s/vendor/autoload.php
      DRE_TEST_MYSQL_HOST: 127.0.0.1
      DRE_TEST_MYSQL_PASSWORD: dre-search-ci-password
      TYPESENSE_HOST: 127.0.0.1
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: dre-search-ci-key
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Load the released Omeka runtime (framework dependencies belong to core)
        run: |
          curl --fail --location --retry 3 https://github.com/omeka/omeka-s/releases/download/v4.2.1/omeka-s-4.2.1.zip -o /tmp/omeka-s.zip
          echo "cc27d1c7aca0209523d19aa285f4a08e29e34950dcc446951a7c1311de348e82  /tmp/omeka-s.zip" | sha256sum -c -
          unzip -q /tmp/omeka-s.zip -d /tmp
          test -f "$OMEKA_VENDOR"
      - run: composer validate --strict
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
      # Installs the committed lock — resolved for PHP 8.3 (config.platform),
      # i.e. exactly what the release archive ships — on every PHP version.
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
      - name: PHP syntax
        run: find Module.php bin config src scripts tests/phpunit -name '*.php' -print0 | xargs -0 -n1 php -l && php -l bin/dre-search
      - run: composer lint
      - name: Wait for Typesense
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8108/health && exit 0
            sleep 2
          done
          echo "::error::Typesense did not become healthy"; exit 1
      # Every test must run here: a skip would mean the Omeka or service
      # integration silently stopped being exercised.
      - run: composer test -- --fail-on-skipped
      - run: composer analyse

  release-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: test -f LICENSE && test -f SECURITY.md && test -f CHANGELOG.md && test -f CONTRIBUTING.md && test -f CITATION.cff && test -f composer.lock
      # One implementation of the module.ini / package.json / CITATION.cff /
      # CHANGELOG agreement check, shared with `npm run lint`.
      - run: node scripts/check-version-consistency.mjs
      # GitHub renders "Cite this repository" from CITATION.cff and silently
      # drops the button when the file does not parse.
      - name: CITATION.cff parses and carries the required keys
        run: |
          python3 - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open('CITATION.cff', encoding='utf-8'))
          missing = [k for k in ('cff-version', 'message', 'title', 'authors') if not d.get(k)]
          if missing:
              sys.exit(f"::error file=CITATION.cff::missing required key(s): {', '.join(missing)}")
          if not any(a.get('family-names') or a.get('name') for a in d['authors']):
              sys.exit("::error file=CITATION.cff::no usable author entry")
          print(f"CITATION.cff OK (cff-version {d['cff-version']}, {len(d['authors'])} author(s)).")
          PY
