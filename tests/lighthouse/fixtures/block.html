    <script type="application/json" id="dre-search-state-97">{"block_id":97,"profile":"research_items","card_kind":"item","search_placeholder":null,"date_mode":"single","show_year":true,"year_bounds":{"min":1500,"max":2025},"facets":["type_s","project_s","country_ss","language_ss","subject_ss","tag_ss","audience_ss","digitisation_ss"],"facet_labels":{"type_s":"Type","project_s":"Project","country_ss":"Country","language_ss":"Language","subject_ss":"Subject","tag_ss":"Tag","audience_ss":"Target audience","digitisation_ss":"Digitisation method"},"default_sort":"relevance","sort_options":[{"value":"relevance","label":"Relevance"},{"value":"newest","label":"Newest first"},{"value":"oldest","label":"Oldest first"},{"value":"title","label":"Title (A–Z)"}],"per_page":20,"item_url_base":"/s/amira/item","endpoints":{"facet":"/dre-search/api/facet","search":"/dre-search/api/search","export":"/dre-search/api/export","suggest":"/dre-search/api/suggest","map":"/dre-search/api/map"},"initial_response":{"available":true,"found":3793,"page":1,"hits":[{"_kind":"item","_profile":"research_items","country_ss":["South Africa"],"creator_ss":["Watkins, Lee"],"date":1745798400,"description":"pages: v","digitisation_ss":["Digital","born digital"],"id":"32328","language_ss":["English"],"origin_ss":["South Africa"],"project_s":"International Library of African Music","provenance_ss":["Rhodes University"],"tag_ss":["African Music"],"thumbnail_url":"/files/medium/1d2dc4516a3f0ee5a8064c74ae1d5d96b4189dce.jpg","title":"From the Editor","type_s":"Text","year":2025},{"_kind":"item","_profile":"research_items","abstract":"At the Department of Performing Arts and Film at Makerere University, Kampala, Uganda, there is a growing trend of integrating community musicians into music and dance education through workshops on Ugandan musical traditions. These musicians, who play a vital role in the creation, preservation, and transmission of traditional music, function as living archives within their communities. Drawing on research conducted at Makerere University from 2021 to 2023, this article examines how engaging community musicians as key contributors to teaching and learning Ugandan musics has the potential to decolonise music education in Uganda. In describing the benefits of this inclusive approach, I critique the persistence of elitist frameworks in Ugandan university music and dance departments, which often prioritise engagement with PhD holders and published materials over community-based knowledge. I argue that community musicians, as living archives, offer invaluable insights that can foster the sustainable teaching and learning of Uganda’s diverse musical heritage. Sustainable teaching and learning, as conceptualised in this article, involve educational practices that acknowledge and integrate the contributions of all stakeholders in the production, dissemination, and appreciation of knowledge, thereby ultimately benefiting educational institutions, students, and the communities to which students may return after graduation.","country_ss":["South Africa"],"creator_ss":["Makwa, Dominic D. B."],"date":1745798400,"description":"pages: 1-19","digitisation_ss":["Digital","born digital"],"id":"32324","language_ss":["English"],"origin_ss":["South Africa"],"project_s":"International Library of African Music","provenance_ss":["Rhodes University"],"subject_ss":["Musicians","Decolonisation","Archives","Education","Uganda"],"tag_ss":["Decolonial Music Education","Community Musicians","Living Archives","African Music","Music Education"],"thumbnail_url":"/files/medium/851f70bd523d71944e720d95f1b578c859bfa150.jpg","title":"Harnessing community musicians as living archives for “sustainable” teaching and learning of Ugandan musics at Makerere University","type_s":"Text","year":2025},{"_kind":"item","_profile":"research_items","abstract":"Considering it in relation to the earlier musical culture of kwaito, this article aims to begin a historicisation of the Black, township music of amapiano. “Kwaito as history,” much like the musical cultures in question, is ambiguous in that it considers kwaito and the musics that preceded it as part of amapiano’s history and as a tool to study the history of the latter musical form. I do this by positioning amapiano within a longer history of Black township music, focusing mbaqanga, bubblegum, and kwaito. In this article, I demonstrate how amapiano’s emphasis on dance; the role of the township; and broader conceptions of a Black South Africa no longer divided along ethnic lines can be traced back to earlier forms such as marabi and mbaqanga. I show how the music’s new modes of politics; the broad influence of Euro-American styles; and use of new technologies (specifically synthesised sounds) show a clear connection with bubblegum. Concerning kwaito and amapiano, I compare the issues of the date and place of origin; the role of international sonic preferences; the innovative approaches of young, Black township residents to music-making and dissemination. I have used existing historical accounts of Black, township dance music to demonstrate the multivocal and ambiguous nature of these histories.","country_ss":["South Africa"],"creator_ss":["Eaby-Lomas, Dion Malcolm"],"date":1745798400,"description":"pages: 21-36","digitisation_ss":["Digital","born digital"],"id":"32320","language_ss":["English"],"origin_ss":["South Africa"],"project_s":"International Library of African Music","provenance_ss":["Rhodes University"],"subject_ss":["Dance","Music","History","Youth","Local government"],"tag_ss":["Kwaito (Music)","Amapiano (Music)","Post-apartheid","Township","African Music"],"thumbnail_url":"/files/medium/6a5d1e772e3ae9c417d6b50444a4f7a79d577811.jpg","title":"Kwaito as history","type_s":"Text","year":2025},{"_kind":"item","_profile":"research_items","abstract":"Andalusi music traces its origins to the development of distinct musical and poetic forms (nubat, zejel, and so on) on the Iberian Peninsula since the ninth century. Andalusi music continues to be performed in various Mediterranean countries, predominantly Morocco, Algeria, Tunisia, and Libya. This article examines how Andalusi music links the precolonial imaginary, the colonial past, and postcolonial narratives of Spain within an Afro-Asian context. By focusing on performative commonalities across a vast region that have origins in al-Andalus, this article explores the concept of convivencia (coexistence) in relation to the intercultural rhetoric of Andalusi music. The article also considers its interaction with other modal systems such as haul from Mauritania, music associated with the Mande Empire in West Africa, the Middle Eastern and North African maqamat, Persian dastgah, and Hindustani raags. In the course of this exploration, the article broadens the understanding of the historical and contemporary circulation of music across continents. In addition, this article explores the afterlives of Ziryab, an African musician and a contested founder of Andalusi music, whose legacy emphasises the significant role of Africa in the musical development of al-Andalus.","country_ss":["South Africa"],"creator_ss":["Amoros, Luis Gimenez"],"date":1745798400,"description":"pages: 37-55","digitisation_ss":["Digital","born digital"],"id":"32316","language_ss":["English"],"origin_ss":["South Africa"],"project_s":"International Library of African Music","provenance_ss":["Rhodes University"],"subject_ss":["North Africa","Border crossing"],"tag_ss":["Al-Andalus","Maqam","Ziryab","Andalusi Music","Musical Circulation","Nubat","Convivencia","African Music"],"thumbnail_url":"/files/medium/88099a1f42a8308b79c6d63fa82360672418c877.jpg","title":"Andalusi music","type_s":"Text","year":2025},{"_kind":"item","_profile":"research_items","abstract":"Currently, music education in Ghana emphasises Western models, thoughts, content, practices, and pedagogy. Conversely, musics that may use alternative transmission practices, express elements of music differently, or utilise indigenous learning systems have only a marginal place in the curriculum. Over the past decades, there have been several attempts to decolonise the study of music in African higher institutions. Yet, such efforts have largely been limited to adding local content to the curriculum. In the Ghanaian context, brass bands constitute one of the major musical legacies of the colonial enterprise and are a clear enactment of decolonisation, yet they are considered mere entertainment bereft of deeper significance. Little is said about them in the discourse of decolonisation. Drawing on indigenous learning systems, frameworks, and methodologies used by local brass band musicians in Cape Coast and Elmina, I argue that indigenous knowledge systems of music instruction are as valuable as Western methods. Th e notion of the university as the only place for the advancement of thought and knowledge production — at the expense of indigenous knowledge systems as these pertain to music — should be challenged by African music scholars. Community ensembles must be valued for their contribution to musicological knowledge and discourses as well as for their preservation and transformation of music knowledge. I conclude that such valorisation will be an important step towards decolonising the music curriculum at universities in Ghana.","country_ss":["South Africa"],"creator_ss":["Dordzro, John-Doe"],"date":1745798400,"description":"pages: 57-76","digitisation_ss":["Digital","born digital"],"id":"32312","language_ss":["English"],"origin_ss":["South Africa"],"project_s":"International Library of African Music","provenance_ss":["Rhodes University"],"subject_ss":["Decolonisation","Brass bands","Education"],"tag_ss":["Transgressive Learning","Indigenous Knowledge System","Music Education","Pedagogy","African Music"],"thumbnail_url":"/files/medium/44ec613e7273c1665a671dac2e98d3bbeca24322.jpg","title":"Adaptation of indigenous approaches to music pedagogy","type
