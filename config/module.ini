[info]
name              = "DRE Search"
description       = "Typesense-backed faceted search for the Africa Multiple DRE Omeka S instance. Ships two search corpora as page blocks — research items and research projects — indexed directly from the Omeka dashboard (MySQL → Typesense); no external pipeline. Corpora are config-driven search profiles. Typesense is optional — the module installs and the site runs normally when it is not configured."
author            = "Frédérick Madore"
configurable      = true
version           = "0.3.1"
module_link       = "https://github.com/AM-Digital-Research-Environment/DRESearch"
author_link       = "https://www.frederickmadore.com"
omeka_version_constraint = "^4.2.0"
