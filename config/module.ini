[info]
name              = "DRE Search"
description       = "Typesense-backed faceted search for the Africa Multiple DRE Omeka S instance. Indexes research items directly from the Omeka dashboard (MySQL → Typesense); no external pipeline. Typesense is optional — the module installs and the site runs normally when it is not configured."
author            = "Frédérick Madore"
configurable      = true
version           = "0.1.0"
module_link       = "https://github.com/AM-Digital-Research-Environment/DRESearch"
author_link       = "https://www.frederickmadore.com"
omeka_version_constraint = "^4.2.0"
