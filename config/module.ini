[info]
name              = "DRE Search"
description       = "Typesense-backed faceted search for the Africa Multiple DRE Omeka S instance. Ships twelve search corpora as page blocks — research items, research projects, publications, podcasts, YouTube videos, people, research sections, organisations (institutions & groups), and the authority terms genres, languages, locations, and subjects & tags — indexed directly from the Omeka dashboard (MySQL → Typesense); no external pipeline. Corpora are config-driven search profiles. Typesense is optional — the module installs and the site runs normally when it is not configured."
author            = "Frédérick Madore"
configurable      = true
version           = "1.20.2"
module_link       = "https://github.com/AM-Digital-Research-Environment/DRESearch"
author_link       = "https://www.frederickmadore.com"
omeka_version_constraint = "^4.2.0"
